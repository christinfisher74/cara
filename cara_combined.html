<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cara — Move Better</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --green:#5C7A6B;
    --olive:#8A9A6A;
    --taupe:#C4B5A0;
    --charcoal:#3D3D3D;
    --cream:#F7F4EE;
    --line:#D9D2C4;
    --warm:#F0EBE3;
    --lgreen:#EAF0EC;
    --white:#FFFFFF;
  }

  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--charcoal);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 16px 60px;
  }
  .app{width:100%;max-width:540px;}

  /* Header */
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--green);font-weight:700;margin-bottom:5px;}
  h1{font-family:'Fraunces',serif;font-size:30px;font-weight:600;line-height:1.1;margin-bottom:5px;}
  .sub{font-size:13px;color:#777;line-height:1.5;margin-bottom:18px;}

  /* Tabs */
  .tabs{display:flex;gap:6px;margin-bottom:16px;}
  .tab{
    flex:1;padding:10px 4px;border-radius:30px;font-size:12px;font-weight:700;
    font-family:'Inter',sans-serif;border:2px solid var(--line);
    background:var(--white);color:#999;cursor:pointer;transition:all .2s;
    letter-spacing:.01em;line-height:1.3;text-align:center;
  }
  .tab.active{background:var(--charcoal);border-color:var(--charcoal);color:var(--white);}
  .tab-desc{font-size:10px;font-weight:500;opacity:.7;display:block;margin-top:2px;}

  /* Context banner */
  .context{
    border-radius:12px;padding:10px 14px;margin-bottom:14px;
    font-size:12.5px;line-height:1.5;
  }
  .context.mobility{background:var(--lgreen);border-left:3px solid var(--green);color:#3a5a4a;}
  .context.hip1{background:var(--warm);border-left:3px solid var(--charcoal);color:#5a4a3a;}
  .context.hip2{background:var(--lgreen);border-left:3px solid var(--olive);color:#3a5a4a;}
  .context strong{font-weight:700;}

  /* Legend */
  .legend{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:14px;
  }
  .legend-title{font-size:10px;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:#aaa;margin-bottom:8px;}
  .legend-row{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .legend-row:last-child{margin-bottom:0;}
  .leg-tag{font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 9px;border-radius:20px;white-space:nowrap;flex-shrink:0;margin-top:1px;}
  .leg-text{font-size:11.5px;color:#777;line-height:1.4;}

  /* Progress */
  .progress-wrap{
    background:var(--white);border:1px solid var(--line);border-radius:12px;
    padding:14px 14px 10px;margin-bottom:14px;
  }
  .prog-meta{display:flex;justify-content:space-between;font-size:11px;font-weight:600;
    text-transform:uppercase;letter-spacing:.07em;color:#aaa;margin-bottom:10px;}
  .prog-track{height:4px;background:var(--line);border-radius:4px;margin-bottom:10px;position:relative;}
  .prog-fill{height:4px;background:var(--green);border-radius:4px;transition:width .4s ease;}
  .dots{display:flex;justify-content:space-between;flex-wrap:nowrap;overflow:hidden;}
  .dot{
    width:13px;height:13px;border-radius:50%;border:2.5px solid var(--line);
    background:var(--white);transition:all .25s;flex-shrink:0;
  }
  .dot.done{background:var(--green);border-color:var(--green);}
  .dot.active{background:var(--olive);border-color:var(--olive);transform:scale(1.35);
    box-shadow:0 0 0 3px rgba(138,154,106,.2);}

  /* Step tags */
  .step-tag{
    display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;padding:4px 11px;border-radius:20px;margin-bottom:10px;
  }
  .tag-mobility{background:var(--green);color:white;}
  .tag-release{background:#3D3D3D;color:white;}
  .tag-lengthen{background:#5C7A6B;color:white;}
  .tag-activate{background:#8A9A6A;color:white;}

  /* Side badge */
  .side-badge{
    display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;padding:3px 10px;border-radius:10px;margin-bottom:10px;
  }
  .side-right{background:#FEF3F2;color:#C0392B;}
  .side-both{background:var(--lgreen);color:var(--green);}
  .side-left{background:#EFF6FF;color:#2563EB;}

  /* Card */
  .card{
    background:var(--white);border:1px solid var(--line);border-radius:18px;
    padding:22px 20px 18px;text-align:center;
  }
  .move-num{font-size:11px;color:#aaa;font-weight:600;letter-spacing:.04em;margin-bottom:3px;}
  .move-name{
    font-family:'Fraunces',serif;font-size:23px;font-weight:600;
    line-height:1.15;margin-bottom:6px;min-height:54px;
    display:flex;align-items:center;justify-content:center;
  }
  .reps-badge{
    display:inline-block;background:var(--cream);border:1px solid var(--line);
    border-radius:20px;font-size:11px;font-weight:700;color:var(--charcoal);
    padding:3px 13px;margin-bottom:12px;
  }
  .setup-box{
    background:var(--warm);border-left:3px solid var(--green);
    border-radius:0 10px 10px 0;padding:9px 13px;margin-bottom:12px;
    text-align:left;
  }
  .setup-label{font-size:9px;font-weight:700;text-transform:uppercase;
    letter-spacing:.1em;color:var(--green);margin-bottom:3px;}
  .setup-text{font-size:12px;color:var(--charcoal);line-height:1.5;}
  .move-cue{
    font-size:12.5px;color:#777;line-height:1.55;
    margin:0 auto 16px;text-align:left;
  }

  /* Timer ring */
  .timer-wrap{position:relative;width:168px;height:168px;margin:0 auto 16px;}
  svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--line);stroke-width:9;}
  .ring-fg{fill:none;stroke:var(--green);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s linear;}
  .ring-fg.mobility{stroke:var(--green);}
  .ring-fg.release{stroke:#3D3D3D;}
  .ring-fg.lengthen{stroke:#5C7A6B;}
  .ring-fg.activate{stroke:#8A9A6A;}
  .t-center{position:absolute;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .t-num{font-family:'Fraunces',serif;font-size:40px;font-weight:600;line-height:1;}
  .t-unit{font-size:10px;color:#aaa;text-transform:uppercase;letter-spacing:.08em;margin-top:3px;}

  /* Controls */
  .controls{display:flex;gap:8px;justify-content:center;margin-bottom:4px;}
  button{font-family:'Inter',sans-serif;border:none;cursor:pointer;font-weight:600;transition:all .15s;}
  .btn-play{background:var(--charcoal);color:var(--white);font-size:14px;padding:12px 26px;border-radius:30px;}
  .btn-play:hover{background:#222;}
  .btn-play:active{transform:scale(.97);}
  .btn-skip{background:var(--white);color:var(--charcoal);border:1.5px solid var(--line);
    font-size:13px;padding:11px 16px;border-radius:30px;}
  .btn-skip:hover{border-color:var(--olive);color:var(--olive);}
  .nav-row{display:flex;justify-content:space-between;margin-top:12px;}
  .nav-btn{background:none;color:#aaa;font-size:12px;padding:6px;}
  .nav-btn:hover{color:var(--charcoal);}
  .nav-btn:disabled{opacity:.25;cursor:default;}

  /* Complete */
  .complete{text-align:center;padding:28px 12px;}
  .check{width:56px;height:56px;border-radius:50%;background:var(--green);color:white;
    display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;}
  .complete h2{font-family:'Fraunces',serif;font-size:22px;margin-bottom:6px;}
  .complete p{font-size:13px;color:#777;margin-bottom:18px;line-height:1.5;}

  footer{text-align:center;margin-top:22px;font-size:11px;color:#bbb;letter-spacing:.04em;}

  @media(max-width:400px){
    h1{font-size:25px;}
    .move-name{font-size:19px;}
    .timer-wrap{width:148px;height:148px;}
    .t-num{font-size:34px;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="eyebrow">Feminine Strength &amp; Sustainable Energy · Coach Christin</div>
    <h1>Move Better, Cara</h1>
    <p class="sub">Three routines, one place. Pick the one that fits your day and hit Start.</p>
  </header>

  <div class="tabs">
    <button class="tab active" id="tab0" onclick="switchTab(0)">
      🚗 Road Trip
      <span class="tab-desc">Daily mobility</span>
    </button>
    <button class="tab" id="tab1" onclick="switchTab(1)">
      ⚡ Hip Day 1
      <span class="tab-desc">Release + Lengthen</span>
    </button>
    <button class="tab" id="tab2" onclick="switchTab(2)">
      💪 Hip Day 2
      <span class="tab-desc">Activate + Move</span>
    </button>
  </div>

  <div id="contextBanner"></div>
  <div id="legendBox"></div>

  <div class="progress-wrap">
    <div class="prog-meta">
      <span id="progLabel">Move 1</span>
      <span id="progSection"></span>
    </div>
    <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
    <div class="dots" id="dots"></div>
  </div>

  <div id="card"></div>

  <footer>Coach Christin Fisher · @christin_fisher · femininestrengthco.com</footer>
</div>

<script>
const TABS = [

  // ── TAB 0: ROAD TRIP MOBILITY ─────────────────────────────────────────
  {
    context: "mobility",
    contextText: "<strong>Road trip or rest day?</strong> This is your 10–15 minute full body routine. Hotel room, rest stop, wherever you land. No equipment needed.",
    legend: null,
    moves: [
      {step:"mobility", name:"90/90 Hip Switch", side:"both", time:40, reps:"8 reps each side",
       setup:"Sit on the floor with both knees bent at 90 degrees — one in front, one to the side. Sit up tall.",
       cue:"Slowly rotate both legs to switch sides. Keep both sit bones grounded as long as possible. Breathe out as you switch. This opens the hips and warms up the spine."},
      {step:"mobility", name:"Standing Hip Flexor Stretch — Right", side:"right", time:30, reps:"Hold 30 seconds",
       setup:"Step your right foot forward into a slight lunge. Keep your back leg as straight as comfortable.",
       cue:"Squeeze your back glute and gently tuck your pelvis under. You should feel a stretch at the front of the left hip. Hold and breathe. Don't arch your low back."},
      {step:"mobility", name:"Standing Hip Flexor Stretch — Left", side:"left", time:30, reps:"Hold 30 seconds",
       setup:"Switch sides. Step your left foot forward.",
       cue:"Same thing on the other side. Squeeze the right glute, tuck the pelvis under. Hold and breathe."},
      {step:"mobility", name:"Seated Figure-4 — Right", side:"right", time:30, reps:"Hold 30 seconds",
       setup:"Sit in a chair or on the floor. Cross your right ankle over your left knee.",
       cue:"Gently hinge forward until you feel a stretch deep in the right glute and hip. Breathe and let the hip open. Don't force it — gravity does the work here."},
      {step:"mobility", name:"Seated Figure-4 — Left", side:"left", time:30, reps:"Hold 30 seconds",
       setup:"Switch sides. Cross your left ankle over your right knee.",
       cue:"Same stretch on the left side. Breathe and let it open."},
      {step:"mobility", name:"Cat–Cow", side:"both", time:40, reps:"10 slow reps",
       setup:"Get on all fours — hands under shoulders, knees under hips.",
       cue:"Cat: exhale and round your spine toward the ceiling, tuck your chin and tailbone. Cow: inhale and let your belly drop, lift your head and tailbone. Move slow. Feel the whole spine moving."},
      {step:"mobility", name:"World's Greatest Stretch — Right", side:"right", time:30, reps:"5 reps",
       setup:"Start in a lunge with your right foot forward, left knee on the floor.",
       cue:"Place your right hand on the floor inside your right foot. Rotate your right arm up toward the ceiling, following with your eyes. Feel the hip flexor, t-spine, and hamstring all opening at once. 5 slow reps."},
      {step:"mobility", name:"World's Greatest Stretch — Left", side:"left", time:30, reps:"5 reps",
       setup:"Switch sides. Left foot forward, right knee on floor.",
       cue:"Same movement on the left. Rotate the left arm up. Breathe through each rep."},
      {step:"mobility", name:"Standing Forward Fold", side:"both", time:30, reps:"Hold 30 seconds",
       setup:"Stand with feet hip-width apart.",
       cue:"Soften your knees and fold forward, letting your head hang heavy. Don't try to touch the floor — just let gravity pull you down. Breathe and feel the hamstrings and low back release."},
      {step:"mobility", name:"Single Leg RDL Reach — Right", side:"right", time:40, reps:"8 reps",
       setup:"Stand on your right leg. Soft knee. Arms by your sides.",
       cue:"Hinge forward on one leg, reaching your hands toward the floor while your left leg lifts behind you. Control the return. No weight needed — this is a balance and hamstring drill."},
      {step:"mobility", name:"Single Leg RDL Reach — Left", side:"left", time:40, reps:"8 reps",
       setup:"Switch to your left leg.",
       cue:"Same drill on the other side. Keep the hinge controlled. Right leg lifts behind you as you reach down."},
      {step:"mobility", name:"Thread the Needle", side:"both", time:36, reps:"6 reps each side",
       setup:"Get on all fours — hands under shoulders, knees under hips.",
       cue:"Take your right arm and reach it under and through to the left, letting your right shoulder drop toward the floor. Feel the upper back open. Come back up, then switch sides. 6 reps each way."},
      {step:"mobility", name:"Wall Slides", side:"both", time:30, reps:"10 reps",
       setup:"Stand with your back flat against a wall. Arms up in a goalpost position, elbows and wrists touching the wall.",
       cue:"Slowly slide your arms up overhead, keeping everything in contact with the wall. Then slide back down. This resets the shoulders and undoes the hunching from travel. Go slow."},
      {step:"mobility", name:"Deep Squat Hold", side:"both", time:40, reps:"Hold 30–40 seconds",
       setup:"Stand with feet slightly wider than hip-width, toes turned out slightly.",
       cue:"Lower into a deep squat and hold. Use a doorframe for support if needed. Breathe and let the hips sink. Feel the inner thighs, glutes, and ankles all releasing. You're done with the road trip routine."},
    ]
  },

  // ── TAB 1: HIP DAY 1 ─────────────────────────────────────────────────
  {
    context: "hip1",
    contextText: "<strong>Do this before Day 1 training</strong> — or on its own on a rest day. Right side is the priority. Always start right, then left.",
    legend: true,
    moves: [
      {step:"release", name:"Foam Roller — Piriformis", side:"both", time:60, reps:"Hold 60 sec each side",
       setup:"Sit on the foam roller. Cross your right ankle over your left knee. Lean your weight into the right glute.",
       cue:"Find the tender spot deep in the back of the hip and HOLD on it. Don't roll back and forth — just breathe through the pressure. Right side first, then left. It will be uncomfortable. That's the tight tissue releasing."},
      {step:"release", name:"Lacrosse Ball — Piriformis", side:"both", time:75, reps:"Hold 75 sec each side",
       setup:"Same position as the roller but with the lacrosse ball. The ball is smaller and gets deeper into the tissue.",
       cue:"Find the spot just inside the back of the hip pocket. Hold on it, breathe slow, wait for the tissue to soften. Right side first. This one does the real deep work — don't rush it."},
      {step:"release", name:"Foam Roller — Hip Flexor", side:"both", time:60, reps:"Hold 60 sec each side",
       setup:"Lie face down. Place the roller just below your right hip crease — at the very top front of the thigh. Prop up on your forearms.",
       cue:"Hold on tender spots — don't roll. The right side will feel much tighter. That's the shortened hip flexor we're targeting. Breathe and let it release."},
      {step:"release", name:"Figure-4 Stretch", side:"both", time:60, reps:"Hold 60 sec each side",
       setup:"Lie on your back, knees bent. Cross your right ankle over your left knee to make a figure-4. Flex your right foot.",
       cue:"Gently pull your left thigh toward your chest until you feel a stretch deep in the right glute. Breathe and let it open with each exhale. Then switch sides."},
      {step:"lengthen", name:"Couch Stretch", side:"both", time:90, reps:"Hold 90 sec each side",
       setup:"Kneel facing away from a wall. Place your RIGHT knee on the floor, right foot up the wall behind you. Left foot steps forward, left knee at 90 degrees.",
       cue:"Squeeze your right glute hard and tuck your pelvis under — tailbone toward the floor. Don't let the low back arch. Hold and breathe. This is the most important stretch in the whole program. Right side first, then left."},
      {step:"lengthen", name:"90/90 Hip Rotation", side:"both", time:60, reps:"8 slow breaths each side",
       setup:"Sit on the floor, both knees bent at 90 degrees — one leg in front, one behind. Right leg in front first.",
       cue:"Let your right knee slowly fall toward the floor. You're working hip internal rotation. Hold the end range, exhale fully with each breath. Right hip will have less range than left — that's expected. Then switch."},
      {step:"lengthen", name:"Kneeling Hip Flexor Stretch", side:"both", time:60, reps:"Hold 60 sec each side",
       setup:"Kneel on your right knee, left foot forward. Torso upright. Right side first.",
       cue:"Shift your hips gently forward until you feel a stretch at the front of the right hip. Add a right arm reach overhead to get the psoas — the deep hip flexor. Hold and breathe. Then left side. Don't skip the left — it's compensating too."},
      {step:"lengthen", name:"Final Figure-4 — Breathe It Out", side:"both", time:60, reps:"60 seconds — slow deep breaths",
       setup:"Back on your back. Repeat the figure-4 position. Close your eyes.",
       cue:"Breathe in for 4 counts, out for 6. Let every exhale release a little more tension. You've done the work. Day 1 is done."},
    ]
  },

  // ── TAB 2: HIP DAY 2 ─────────────────────────────────────────────────
  {
    context: "hip2",
    contextText: "<strong>Do this before Day 2 training</strong> — or on its own. You're waking up the right glute and teaching it to fire the way it should. Slow and deliberate wins here.",
    legend: true,
    moves: [
      {step:"activate", name:"Prone Hip Extension", side:"both", time:45, reps:"10 reps each side — slow",
       setup:"Lie face down on the floor. Arms by your sides or under your forehead. Legs straight.",
       cue:"Squeeze your RIGHT glute first, then lift the right leg a few inches off the floor. Hold 1 second. Lower slowly. 10 reps, then left side. The right will feel weaker or delayed — that's exactly what we're fixing. Think 'glute first' before the leg moves at all."},
      {step:"activate", name:"Standing Hip Extension — Band", side:"right", time:45, reps:"15 reps — right side only",
       setup:"Loop a resistance band around your right ankle and attach it to something low. Stand facing the anchor point. Hold a wall for balance if needed.",
       cue:"Drive your right leg straight back. Small range — about 12 inches. Squeeze the right glute at the end of each rep. This is the exact movement your hip skips when you stand up from a chair. We're retraining it here, with intention."},
      {step:"activate", name:"Single Leg Glute Bridge — Right", side:"right", time:40, reps:"12 reps — hold 2 sec at top",
       setup:"Lie on your back, knees bent. Extend your LEFT leg straight. Only your RIGHT foot stays on the floor.",
       cue:"Press through your right heel and drive your hips up. Hold 2 full seconds at the top — squeeze the right glute as hard as you can. If you feel this in your hamstring more than your glute, press your heel harder into the floor. Lower slowly."},
      {step:"activate", name:"Single Leg Glute Bridge — Left", side:"left", time:40, reps:"12 reps — hold 2 sec at top",
       setup:"Same position — now extend your RIGHT leg straight. Only your LEFT foot stays on the floor.",
       cue:"Same drill on the left. Hold 2 seconds at the top. Notice how this side compares to the right. The left should feel more natural — but still give it full effort. Full squeeze every rep."},
      {step:"activate", name:"Clamshell — Right Side", side:"right", time:40, reps:"15 reps — slow and controlled",
       setup:"Band just above both knees. Lie on your LEFT side, hips stacked, knees bent at 45 degrees. Right leg on top.",
       cue:"Keeping your feet together, rotate your right knee open toward the ceiling. Don't let your hip roll backward — keep the pelvis still. Squeeze the right glute at the top. Lower slowly. This is your weaker side — feel every rep."},
      {step:"activate", name:"Clamshell — Left Side", side:"left", time:40, reps:"15 reps — slow and controlled",
       setup:"Flip over. Band still above knees. Lie on your RIGHT side. Left leg on top.",
       cue:"Same movement, left knee opens toward the ceiling. The left glute med is also underactivating. Same cues: pelvis still, squeeze at the top, lower slowly. Don't phone this one in."},
      {step:"activate", name:"Side Plank Hip Abduction", side:"right", time:35, reps:"12 reps",
       setup:"Lie on your right side. Prop up on your right forearm, elbow under shoulder. Stack your feet. Lift into a side plank.",
       cue:"Keeping the plank, lift your top (left) leg toward the ceiling, then lower slowly. You're working the right glute med to hold the plank and the left glute med to lift. If your left hip flexor starts gripping — stop, breathe, reset before continuing."},
      {step:"activate", name:"Gait Drill — Right Heel Push", side:"right", time:45, reps:"10 slow steps, turn, repeat",
       setup:"Find a clear space to walk. Across the room, a hallway, anywhere.",
       cue:"Walk slowly. On every right step, think one thing: 'push the floor back with my right heel.' That cue fires the right glute in the exact pattern it's been skipping. 10 slow steps, turn, come back. Do this every single day — even just walking to your car. This is how the pattern rewires in real life."},
    ]
  }

];

const RADIUS = 74;
const CIRC = 2 * Math.PI * RADIUS;

let tabIdx = 0;
let moveIdx = 0;
let timeLeft = 0;
let totalTime = 0;
let interval = null;
let running = false;
let done = false;

function tab(){ return TABS[tabIdx]; }
function moves(){ return tab().moves; }
function cur(){ return moves()[moveIdx]; }

function tagClass(s){
  return {mobility:'tag-mobility',release:'tag-release',lengthen:'tag-lengthen',activate:'tag-activate'}[s]||'tag-mobility';
}
function tagLabel(s){
  return {mobility:'Mobility',release:'Release',lengthen:'Lengthen',activate:'Activate'}[s]||s;
}
function sideClass(s){ return {right:'side-right',left:'side-left',both:'side-both'}[s]; }
function sideLabel(s){ return {right:'⚡ Right Side Priority',left:'Left Side',both:'Both Sides'}[s]; }

function renderContext(){
  const t = tab();
  document.getElementById('contextBanner').innerHTML =
    `<div class="context ${t.context}">${t.contextText}</div>`;

  if(t.legend){
    document.getElementById('legendBox').innerHTML = `
      <div class="legend">
        <div class="legend-title">Color guide</div>
        <div class="legend-row"><span class="leg-tag tag-release">Release</span><span class="leg-text">Soft tissue — foam roller or ball. Find the tight spot and hold. Don't roll.</span></div>
        <div class="legend-row"><span class="leg-tag tag-lengthen">Lengthen</span><span class="leg-text">Stretching. Hold the position, breathe, let each exhale release more tension.</span></div>
        <div class="legend-row"><span class="leg-tag tag-activate">Activate</span><span class="leg-text">Muscle activation. Slow and deliberate — you're teaching your brain to fire the right glute.</span></div>
        <div class="legend-row"><span class="side-badge side-right" style="font-size:9px;padding:2px 8px;">⚡ Right Priority</span><span class="leg-text">Right side first — it's the tighter, weaker side we're targeting.</span></div>
      </div>`;
  } else {
    document.getElementById('legendBox').innerHTML = '';
  }
}

function buildDots(){
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  moves().forEach((_,i)=>{
    const d = document.createElement('div');
    d.className='dot'; d.id='dot'+i;
    wrap.appendChild(d);
  });
}

function updateProgress(){
  const total = moves().length;
  document.getElementById('progLabel').textContent = done ? 'Complete!' : `Move ${moveIdx+1} of ${total}`;
  document.getElementById('progSection').textContent = done ? '✓' : tagLabel(cur().step);
  document.getElementById('progFill').style.width = done ? '100%' : `${(moveIdx/(total-1))*100}%`;
  moves().forEach((_,i)=>{
    const d=document.getElementById('dot'+i);
    d.className='dot';
    if(done||i<moveIdx) d.classList.add('done');
    else if(i===moveIdx) d.classList.add('active');
  });
}

const COMPLETE_MSGS = [
  "Nice work. You showed up for your body today. Come back tomorrow for Hip Day 1.",
  "Day 1 done. You released and lengthened both hips. Come back for Hip Day 2 — activation is next.",
  "Day 2 done. Motor patterns reinforced. That gait drill at the end? Do it every time you walk to your car — that's how this actually rewires."
];

function render(){
  const card = document.getElementById('card');
  if(done){
    card.innerHTML=`
      <div class="card">
        <div class="complete">
          <div class="check">✓</div>
          <h2>Done.</h2>
          <p>${COMPLETE_MSGS[tabIdx]}</p>
          <button class="btn-play" onclick="restart()">Start over</button>
        </div>
      </div>`;
    return;
  }
  const m = cur();
  const offset = CIRC*(1-timeLeft/totalTime);
  card.innerHTML=`
    <div class="card">
      <span class="step-tag ${tagClass(m.step)}">${tagLabel(m.step)}</span>
      <span class="side-badge ${sideClass(m.side)}">${sideLabel(m.side)}</span>
      <div class="move-num">Move ${moveIdx+1} of ${moves().length}</div>
      <div class="move-name">${m.name}</div>
      <div class="reps-badge">${m.reps}</div>
      <div class="setup-box">
        <div class="setup-label">How to set up</div>
        <div class="setup-text">${m.setup}</div>
      </div>
      <div class="move-cue">${m.cue}</div>
      <div class="timer-wrap">
        <svg width="168" height="168" viewBox="0 0 168 168">
          <circle class="ring-bg" cx="84" cy="84" r="${RADIUS}"/>
          <circle class="ring-fg ${m.step}" id="ringFg" cx="84" cy="84" r="${RADIUS}"
            stroke-dasharray="${CIRC}" stroke-dashoffset="${offset}"/>
        </svg>
        <div class="t-center">
          <div class="t-num" id="tNum">${timeLeft}</div>
          <div class="t-unit">seconds</div>
        </div>
      </div>
      <div class="controls">
        <button class="btn-play" id="playBtn" onclick="toggle()">${running?'Pause':(timeLeft===totalTime?'Start':'Resume')}</button>
        <button class="btn-skip" onclick="next()">Skip →</button>
      </div>
      <div class="nav-row">
        <button class="nav-btn" onclick="prev()" ${moveIdx===0?'disabled':''}>← Back</button>
        <button class="nav-btn" onclick="resetTimer()">Reset</button>
      </div>
    </div>`;
}

function updateRing(){
  const r=document.getElementById('ringFg'), n=document.getElementById('tNum');
  if(!r||!n) return;
  r.style.strokeDashoffset=CIRC*(1-timeLeft/totalTime);
  n.textContent=timeLeft;
}
function toggle(){ running?pause():start(); }
function start(){
  running=true;
  const b=document.getElementById('playBtn');
  if(b) b.textContent='Pause';
  interval=setInterval(()=>{
    timeLeft--;
    updateRing();
    if(timeLeft<=0){ clearInterval(interval); running=false; next(); }
  },1000);
}
function pause(){
  running=false; clearInterval(interval);
  const b=document.getElementById('playBtn');
  if(b) b.textContent='Resume';
}
function resetTimer(){ pause(); timeLeft=totalTime; render(); }
function next(){
  pause();
  if(moveIdx<moves().length-1){
    moveIdx++; timeLeft=cur().time; totalTime=cur().time;
    updateProgress(); render();
  } else { done=true; updateProgress(); render(); }
}
function prev(){
  pause();
  if(moveIdx>0){ moveIdx--; timeLeft=cur().time; totalTime=cur().time; updateProgress(); render(); }
}
function restart(){
  pause(); moveIdx=0; done=false;
  timeLeft=cur().time; totalTime=cur().time;
  buildDots(); updateProgress(); render();
}
function switchTab(i){
  pause(); tabIdx=i; moveIdx=0; done=false;
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',j===i));
  timeLeft=cur().time; totalTime=cur().time;
  renderContext(); buildDots(); updateProgress(); render();
}

// Init
renderContext();
timeLeft=cur().time; totalTime=cur().time;
buildDots(); updateProgress(); render();
</script>
</body>
</html>
